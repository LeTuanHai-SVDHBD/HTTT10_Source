services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup_env.py}
      MYSQL_DATABASE: httt10
      MYSQL_USER: httt10_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup_env.py}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--transaction-isolation=READ-COMMITTED", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h127.0.0.1 -uhttt10_app -e "SELECT 1" httt10']
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    build: ./backend
    environment: &backend_env
      MYSQL_HOST: db
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup_env.py}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup_env.py}
    command: ["python", "-m", "app.cli", "migrate"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    environment: *backend_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  mysql_data:
