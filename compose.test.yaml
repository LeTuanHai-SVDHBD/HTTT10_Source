# Isolated test stack. Run with project name httt10-tests (see README.md).
services:
  test-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: httt10-test-only
      MYSQL_ROOT_HOST: "%"
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--transaction-isolation=READ-COMMITTED", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h127.0.0.1 -uroot -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  tests:
    build: ./backend
    environment:
      MYSQL_TEST_HOST: test-db
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: httt10-test-only
      TEST_RESULT_DIR: /app/test-results
    command: ["python", "run_tests.py"]
    volumes:
      - ./verification:/app/test-results
    depends_on:
      test-db:
        condition: service_healthy
