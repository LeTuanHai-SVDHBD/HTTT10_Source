  description: Thiết kế theo đặc tả chốt 1.3 và MySQL 1.0. Đây là hợp đồng giao diện, chưa phải API đã triển khai.
    Không có public signup, auto-approval hay quyền nội dung toàn đơn vị cho Admin.
servers:
- url: /api/v1
  description: Cùng origin qua reverse proxy, phù hợp demo LAN
security:
- BearerAuth: []
tags:
- name: auth
- name: availability
