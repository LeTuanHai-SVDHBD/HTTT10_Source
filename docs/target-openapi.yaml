      operationId: login
      summary: Đăng nhập nội bộ
      description: JSON email/password, dùng HTTP Bearer JWT; không tự nhận là OAuth2 authorization server. Sai
        thông tin trả lỗi chung, không tiết lộ email tồn tại. Thư trả token không được cache/log.
      tags:
      - auth
      x-use-cases:
      - UC-01
      x-authorization: PUBLIC
      x-db-tables:
      - users
      - user_roles
      - auth_sessions
      responses:
        '200':
          description: Đăng nhập nội bộ - đã hoàn tất lưu nếu là thao tác ghi
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Lỗi được chuẩn hóa, không raw input/SQL/stack trace/nội dung lịch ngoài quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-ID:
